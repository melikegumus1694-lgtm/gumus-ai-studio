name: Assemble Mira Bridal film
on:
  push:
    branches:
      - portfolio-mira-bridal-2026-11-08
    paths:
      - 'assets/.mira-parts/**'
      - '.github/workflows/assemble-mira-bridal.yml'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify original video
        run: |
          cat assets/.mira-parts/part-*.bin > assets/mira-bridal-film.mp4
          test "$(wc -c < assets/mira-bridal-film.mp4)" -eq 6608981
          echo "acf11d51aa03d6b1cfddc1ce9eb9a47bf257487c1e39488c31c5c02f6a2113d9  assets/mira-bridal-film.mp4" | sha256sum -c -
      - name: Commit completed video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mira-bridal-film.mp4
          git rm -r -q assets/.mira-parts
          git commit -m "Assemble Mira Bridal film"
          git push
